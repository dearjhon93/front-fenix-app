<div class="d-flex" style="height: 100vh">

  <!-- Sidebar -->
  <aside
    class="sidebar d-flex flex-column bg-white border-end position-fixed top-0 start-0 h-100"
    [class.open]="menuOpen()"
  >
    <div class="px-4 py-4 border-bottom">
      <h5 class="fw-semibold text-dark m-0">SGA Fenix</h5>
    </div>

    <nav class="flex-column p-3 flex-grow-1 d-flex gap-1">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="nav-link rounded-3 px-3 py-2 text-secondary fw-medium text-decoration-none"
        (click)="closeMenu()"
      >Dashboard</a>
      <a
        routerLink="/inventario"
        routerLinkActive="active"
        class="nav-link rounded-3 px-3 py-2 text-secondary fw-medium text-decoration-none"
        (click)="closeMenu()"
      >Inventario</a>
      <a
        routerLink="/facturas"
        routerLinkActive="active"
        class="nav-link rounded-3 px-3 py-2 text-secondary fw-medium text-decoration-none"
        (click)="closeMenu()"
      >Carga de Facturas</a>
    </nav>

    <div class="p-3 border-top">
      <button
        (click)="auth.logout()"
        class="btn btn-outline-danger w-100"
      >Cerrar sesion</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-grow-1 d-flex flex-column" style="margin-left: 250px; height: 100vh; overflow: hidden">

    <!-- Top bar mobile -->
    <header class="bg-white border-bottom py-2 px-3 d-none d-md-none d-lg-none d-xl-none">
      <div class="d-flex align-items-center">
        <button
          (click)="toggleMenu()"
          class="btn btn-sm btn-outline-secondary"
          aria-label="Toggle menu"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" x2="21" y1="6" y2="6"></line>
            <line x1="3" x2="21" y1="12" y2="12"></line>
            <line x1="3" x2="21" y1="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable content -->
    <div class="flex-grow-1 overflow-auto p-4">
      <router-outlet />
    </div>
  </main>
</div>
